[project]
name = "triggersift"
version = "0.1.0"
description = "Detect ASMR triggers in a video and skip or filter the ones you dislike"
readme = "README.md"
authors = [
    { name = "Louis Laurent" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
sift = "triggersift.cli:main"
sift-server = "triggersift.server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# local GPU models (PE-A-Frame, later SAM Audio): uv sync --extra local
local = [
    "torch>=2.7",
    "torchvision",
    "einops",
    "timm",
    "ftfy",
    "regex",
    "transformers",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "scikit-learn>=1.9.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
