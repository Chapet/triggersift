[project]
name = "triggersift"
version = "0.1.0"
description = "Detect ASMR triggers in a video and skip or filter the ones you dislike"
readme = "README.md"
authors = [
    { name = "Louis Laurent" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
sift = "triggersift.cli:main"
sift-server = "triggersift.server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
