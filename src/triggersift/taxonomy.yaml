# ASMR sound classes (v2, 2026-11-02): classified by the sound you hear, not by the object being touched.
# v1 had ~75 object-level labels (tapping on wood / glass / leather…) with 0–5 examples each: too fine to label or
# learn, and likes/dislikes follow the sound anyway. v1 is kept in ../taxonomy.v1-objects.yaml; `migrate.py` maps
# old labels to these classes. 2026-11-03: mic_contact merged into brushing (user: same sound, only louder;
# loudness is the effects' job, not a class).
#
# Each class is its own category (id without a dot). `group` only orders/heads them in the UI.
# `sound` = SAM Audio / PE-A-Frame text prompt. `covers` = what goes in it, shown to help labeling.

# ---- Short hits
tapping_sharp:
  group: Short hits
  label: Sharp tapping
  sound: sharp tapping on a hard surface
  covers: "fingernails, glass, metal, hard plastic, wood: crisp, bright, ringing"
tapping_soft:
  group: Short hits
  label: Soft tapping
  sound: soft muffled tapping
  covers: "fingertips, hands, leather, cardboard, books, fabric: low, dull, muffled (étouffé)"
clicks:
  group: Short hits
  label: Crisp clicks
  sound: small mechanical clicks
  covers: "keyboard, buttons, controller, mouse, pen, nail clicking, lids, clippers, finger snaps"
crunch:
  group: Short hits
  label: Crunching
  sound: crunching and crumbling
  covers: "kinetic sand, soap cutting, crispy food, ice, scissors, hair cutting"

# ---- Friction
rubbing:
  group: Friction
  label: Rubbing & scratching
  sound: rubbing and scratching
  covers: "hands rubbing, fabric, beard, nails scratching a surface, foam, writing"
brushing:
  group: Friction
  label: Brushing
  sound: soft brush strokes
  covers: "hair brushing, lens brushing, makeup brushes, finger fluttering, swishes; also brushing / scratching right on the mic (fluffy cover, foam), even when loud"
crinkling:
  group: Friction
  label: Crinkling
  sound: crinkling plastic and paper
  covers: "plastic bags, foil, wrappers, cellophane, paper, page turning"

# ---- Wet
mouth:
  group: Wet
  label: Mouth sounds
  sound: wet mouth sounds
  covers: "wet mouth, tongue clicks, kisses, lip smacks, mouthing, chewing / eating"
liquid:
  group: Wet
  label: Liquid & sticky
  sound: water and liquid sounds
  covers: "water, sloshing, slime, lotion / gel, bubbles, lotioned hands"

# ---- Voice & breath
whisper:
  group: Voice & breath
  label: Whispering
  sound: whispering
  covers: "whispering, intelligible or not"
spoken:
  group: Voice & breath
  label: Spoken voice
  sound: person speaking
  covers: "soft speaking, normal talking (intro, sponsor), humming"
breathing:
  group: Voice & breath
  label: Breathing
  sound: person breathing
  covers: "breathing, blowing on the mic, sniffs, sighs (intended or not)"

# ---- Background
steady_noise:
  group: Background
  label: Steady noise
  sound: steady fan noise and electrical hum
  covers: "fan, AC, air purifier, electrical hum / buzz, hiss, white noise"
nature:
  group: Background
  label: Nature & outside
  sound: rain and nature sounds
  covers: "rain, thunder, fire crackling, birds, traffic, outside"
music:
  group: Background
  label: Music
  sound: background music
  covers: "background music"

# ---- Accidents
handling:
  group: Accidents
  label: Unwanted noises
  sound: muffled thud and bump
  covers: "accidental one-off knocks: thuds, desk / mic bumps, chair creaks, room noise (footsteps, doors, pets), spikes, crackle"
